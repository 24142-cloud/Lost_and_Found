name: lost_and_found
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core:
  firebase_auth:
  cloud_firestore:
  provider: ^6.1.2
  image_picker:
  http: ^1.2.2
  crypto: ^3.0.6
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/Symbol.png"
  ios: true
  adaptive_icon_background: "#005F6A"
  adaptive_icon_foreground: "assets/images/Symbol.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
